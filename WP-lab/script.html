<html>
<head>
<title>Maths And String Functions</title>
</head>
<body bgcolor="332CD32">
<center>
<br>
<b><h1><u>Maths And String functions</u></h1><b>
<br><br>
<script>
var a="Welcome";
var b="to";
var c="Ooty";
document.write("string 1:  "+ a + "<br>");
document.write("string 2:  "+ b + "<br>");
document.write("string 3:  "+ c + "<br>");

document.write("<b><h3><u>String functions</u></h></b><br><br>");
document.write(" concate:" + a + b + c + "<br>");
document.write(" To Upper Case:  " + a.toUpperCase() + "<br>");
document.write(" To Lower Case:  " + a.toLowerCase() + "<br>");
document.write(" Length of the string:  " + a.length + "<br>");
document.write(" Repalce of the sring:  " + a.replace(a,b) + "<br>");

document.write("<br><br><b><h3><u>Maths functions</u></h></b><br><br>");
document.write(" Round:" + Math.round(4.5) + "<br>");
document.write(" Power:" + Math.pow(2,3) + "<br>");
document.write(" Floor:" + Math.floor(4.6) + "<br>");
document.write(" Squre Root:" + Math.sqrt(9) + "<br>");
document.write(" Absolute:" + Math.abs(-5) + "<br>");
document.write(" Ceil:" + Math.ceil(4.6) + "<br>");
document.write(" Maximum:" + Math.max(4,6,1,7,3,9) + "<br>");
document.write(" Minimum:" + Math.min(4,6,1,7,3,9) + "<br>");

</script>

</center>
</body>
</html>
